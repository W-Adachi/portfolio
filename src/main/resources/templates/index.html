<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ポートフォリオ</title>
        <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    </head>
    <body>
        <!-- 既存の header タグ部分をこれ1行に置き換えます -->
        <div th:replace="~{fragments/header :: header}"></div>

        <main>
            <!-- ヒーローエリア -->
            <div class="first-view-wrap">
                <h2 class="first-view__title">学びを構造化し、探索可能にするエンジニアリングノート</h2>
                <p class="first-view__description">Java・Spring Bootの学習プロセスと開発成果物を言語・カテゴリ別に集約</p>
            </div>

            <!-- 検索フォームエリア -->
            <div class="search-form-wrap">
                <form action="#" method="get" class="search-form">
                    <input type="text" name="keyword" class="search-form__input" placeholder="キーワードを入力">
                    <button type="submit" class="search-form__button">検索</button>
                </form>
            </div>

            <!-- コンテンツカード一覧エリア -->
            <div class="contents-wrap">
                <div class="contents__item" th:each="project : ${projects}">
                    <a th:href="@{/projects/{id}(id=${project.id})}" class="contents__item-link">
                        <img th:src="${project.imagePath}" src="/img/Group 10.png" alt="サムネイル" class="contents__item-img">
                        <div class="contents__item-body">
                            <h3 class="contents__item-title" th:text="${project.title}">開発成果物</h3>
                            <p class="contents__item-text" th:text="${project.description}">hogehoge</p>
                        </div>
                    </a>
                </div>
            </div>      
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
        
    </body>
</html>
